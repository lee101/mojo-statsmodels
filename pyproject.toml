[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-statsmodels"
version = "0.1.0"
description = "Statsmodels-style OLS, GLM, and ARIMA kernels implemented in Mojo"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
